<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thankyou po Ms!</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{height:100%}
  body{
    background:#1b0a2a;color:#fff0f7;overflow:hidden;
    font-family:Georgia,'Times New Roman',serif;
    display:flex;justify-content:center;align-items:center;perspective:1000px;
  }
  /* soft rainbow glow behind everything */
  .glow{position:fixed;inset:-20%;z-index:0;filter:blur(60px);opacity:.85;
    background:
      radial-gradient(circle at 20% 25%,#ff7eb6 0,transparent 38%),
      radial-gradient(circle at 80% 20%,#b69cff 0,transparent 36%),
      radial-gradient(circle at 75% 80%,#7ad7ff 0,transparent 34%),
      radial-gradient(circle at 25% 80%,#ffb36b 0,transparent 32%),
      radial-gradient(circle at 50% 50%,#ff9ad0 0,transparent 40%);
    animation:drift 18s ease-in-out infinite alternate}
  @keyframes drift{to{transform:rotate(14deg) scale(1.12)}}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

  /* ---------- Envelope ---------- */
  .envelope{position:relative;z-index:3;width:min(430px,86vw);height:min(280px,56vw);
    background:linear-gradient(145deg,#ff9ad0,#d58bff);border-radius:0 0 14px 14px;
    box-shadow:0 0 50px rgba(255,126,182,.55),0 20px 40px rgba(0,0,0,.4);
    cursor:pointer;display:flex;justify-content:center;align-items:center;
    transition:transform .6s,opacity .6s;animation:float 3s ease-in-out infinite}
  .envelope.gone{opacity:0;transform:scale(.5);animation:none;pointer-events:none}
  @keyframes float{50%{transform:translateY(-8px)}}
  .envelope::after{content:'';position:absolute;left:0;right:0;bottom:0;height:6px;border-radius:0 0 14px 14px;
    background:linear-gradient(90deg,#ff7eb6,#ffb36b,#ffe28a,#8ef0c0,#7ad7ff,#b69cff)}
  .flap{position:absolute;top:0;left:0;width:100%;height:55%;background:#ffc2e2;
    clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .4s;z-index:4;pointer-events:none}
  .envelope:hover .flap{transform:rotateX(160deg)}
  .label{z-index:5;pointer-events:none;user-select:none;margin-top:18%;color:#fff;
    font-size:1.3rem;letter-spacing:5px;text-transform:uppercase;text-shadow:0 2px 12px rgba(120,20,90,.5)}

  /* ---------- Message on the site ---------- */
  .stage{position:fixed;z-index:2;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:6vw;text-align:center;opacity:0;pointer-events:none;transition:opacity 1s}
  .stage.show{opacity:1}
  h1{font-size:clamp(2.2rem,7vw,4.2rem);font-style:italic;font-weight:400;line-height:1.15;margin-bottom:.5em;
    background:linear-gradient(90deg,#ff7eb6,#ffb36b,#ffe28a,#8ef0c0,#7ad7ff,#b69cff,#ff7eb6);
    background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 5s linear infinite;filter:drop-shadow(0 0 18px rgba(255,126,182,.55))}
  @keyframes shine{to{background-position:-200% 0}}
  .greet{font-size:clamp(1.1rem,2.6vw,1.5rem);margin-bottom:.8em;color:#ffd6ec}
  .msg{max-width:640px;font-size:clamp(1.05rem,2.5vw,1.45rem);line-height:1.85}
  .w{display:inline-block;opacity:0;transform:translateY(8px);filter:blur(5px);
     transition:opacity .6s,transform .6s,filter .6s;margin-right:.28em}
  .w.on{opacity:1;transform:none;filter:none}
  .w.hl.on{color:#ffe28a;font-weight:bold;text-shadow:0 0 14px rgba(255,126,182,.9)}
  .sign{margin-top:1.6em;font-style:italic;color:#ffd6ec;opacity:0;transform:translateY(10px);transition:all 1s}
  .sign.on{opacity:1;transform:none}
  .sign b{display:block;margin-top:.3em;font-style:normal;color:#fff}
  @media (prefers-reduced-motion:reduce){.glow,.envelope,h1{animation:none}}
  .hint{position:fixed;z-index:6;left:50%;bottom:5vh;transform:translateX(-50%);padding:9px 18px;border-radius:30px;
    background:rgba(255,126,182,.9);color:#fff;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .4s;white-space:nowrap}
  .hint.show{opacity:1}
  .cat{position:fixed;z-index:4;right:3vw;bottom:0;width:min(230px,42vw);cursor:pointer;
    transform:translateY(115%);transition:transform .7s cubic-bezier(.2,1.5,.4,1)}
  .cat.show{transform:translateY(4%)}
  .cat.shake svg{animation:shake .12s linear 10}
  @keyframes shake{25%{transform:translate(-4px,2px) rotate(-3deg)}75%{transform:translate(4px,-2px) rotate(3deg)}}
  .bubble{position:absolute;left:50%;top:-34px;transform:translateX(-50%) rotate(-4deg);padding:6px 16px;border-radius:20px;
    background:#fff;color:#e0398f;font:bold 1.5rem Georgia,serif;letter-spacing:2px;white-space:nowrap;
    box-shadow:0 0 18px rgba(255,126,182,.8)}
</style>
</head>

function star(x,y,r,color,a){
  ctx.globalAlpha = a; ctx.fillStyle = color; ctx.beginPath();
  for (let i = 0; i < 8; i++){ const rad = i % 2 ? r*.25 : r, ang = i*Math.PI/4;
    ctx.lineTo(x + Math.cos(ang)*rad, y + Math.sin(ang)*rad); }
  ctx.closePath(); ctx.fill();
}

}

const fb = atob(FAH_B64), fbytes = new Uint8Array(fb.length);
for (let i = 0; i < fb.length; i++) fbytes[i] = fb.charCodeAt(i);
const fahUrl = URL.createObjectURL(new Blob([fbytes], {type:'audio/mpeg'}));
const cat = document.getElementById('cat');
let fctx = null, fbuf = null, loading = false;
/* unlock + decode the sound on the first real click/tap so it can play later without another tap */
function unlockFx(){
  try{
    fctx = fctx || new (window.AudioContext || window.webkitAudioContext)();
    if (fctx.state === 'suspended') fctx.resume();
    if (!fbuf && !loading){ loading = true; fctx.decodeAudioData(fbytes.buffer.slice(0)).then(b => fbuf = b).catch(()=>{ loading = false; }); }
  }catch(e){}
}
['click','keydown','pointerup','touchend'].forEach(ev => addEventListener(ev, unlockFx));
function faaah(){
  try{
    if (fctx && fbuf){
      if (fctx.state === 'suspended') fctx.resume();
      const s = fctx.createBufferSource(); s.buffer = fbuf; s.connect(fctx.destination); s.start(0); return;
    }
  }catch(e){}
  try{ const a = new Audio(fahUrl); a.play().catch(()=>{}); }catch(e){}
}
function showCat(){ cat.classList.add('show'); setTimeout(()=>{ faaah(); if (!fctx || fctx.state !== 'running'){ hint.textContent = '\u{1F431} Tap the cat for the sound'; hint.classList.add('show'); } cat.classList.remove('shake'); void cat.offsetWidth; cat.classList.add('shake'); },600); }
cat.addEventListener('click', ()=>{ unlockFx(); hint.classList.remove('show'); faaah(); cat.classList.remove('shake'); void cat.offsetWidth; cat.classList.add('shake'); });

/* ---------- start / timing ---------- */
let started = false, fallback = false, t0 = 0, finished = false, playing = false;
const envelope = document.getElementById('envelope'), hint = document.getElementById('hint');
let ac = null, useWeb = false, webStart = 0;
const clock = () => useWeb ? ac.currentTime - webStart : fallback ? (performance.now()-t0)/1000 : audio.currentTime;
/* backup player (Web Audio) in case the normal audio element can't play the file */
function webPlay(){
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  return ac.resume().then(()=>ac.decodeAudioData(bytes.buffer.slice(0))).then(buf=>{
    const s = ac.createBufferSource(); s.buffer = buf; s.connect(ac.destination);
    s.onended = ()=>{ playing = false; finale(); };
    s.start(0); webStart = ac.currentTime; useWeb = true; playing = true; fallback = false;
  });
}

function startStory(x,y){
  if (started) return; started = true;
  x = x || innerWidth/2; y = y || innerHeight/2;
  burst(x,y,110);
  setTimeout(()=>burst(innerWidth*.22,innerHeight*.35),200);
  setTimeout(()=>burst(innerWidth*.78,innerHeight*.35),400);
  setTimeout(()=>burst(innerWidth*.5,innerHeight*.2),600);
  envelope.classList.add('gone');
  setTimeout(()=>{ envelope.style.display='none'; stage.classList.add('show'); }, 500);
}
function finale(){
  if (finished) return; finished = true;
  words.forEach(w => w.classList.add('on')); sign.classList.add('on'); showCat();
  [0,250,500,750,1000].forEach(d => setTimeout(()=>burst(Math.random()*innerWidth*.8+innerWidth*.1,Math.random()*innerHeight*.5+innerHeight*.1,90),d));
}
audio.addEventListener('ended', ()=>{ playing = false; finale(); });

/* called from a real click / tap / key press, so the browser allows sound */
function go(x,y){
  if (finished || (playing && started)) return;
  audio.play().then(()=>{
    playing = true; hint.classList.remove('show');
    if (!started){ audio.currentTime = 0; startStory(x,y); }
    else if (fallback){ audio.currentTime = Math.min((performance.now()-t0)/1000, DUR-.2); fallback = false; }
  }).catch(err=>{
    if (err && err.name === 'NotAllowedError'){            // browser wants another tap
      if (!started){ fallback = true; t0 = performance.now(); startStory(x,y); }
      hint.textContent = '\u{1F50A} Tap anywhere to turn on the music'; hint.classList.add('show');
    } else {                                                // file problem: try the backup player
      webPlay().then(()=>{ hint.classList.remove('show'); if (!started) startStory(x,y); })
      .catch(e2=>{
        if (!started){ fallback = true; t0 = performance.now(); startStory(x,y); }
        hint.textContent = 'Music could not play (' + ((err&&err.name)||'error') + ' / ' + ((e2&&e2.name)||'error') + ')';
        hint.classList.add('show');
      });
    }
  });
}
/* try to play the moment the page opens (works if the browser allows it) */
audio.play().then(()=>{ playing = true; startStory(); }).catch(()=>{});
['click','keydown','pointerup','touchend'].forEach(ev => addEventListener(ev, e => go(e.clientX,e.clientY)));

/* ---------- main loop ---------- */
let shown = 0, tick = 0;
function loop(){
  requestAnimationFrame(loop); tick++;
  ctx.clearRect(0,0,cv.width,cv.height);
  stars.forEach(s => { star(s.x*cv.width,s.y*cv.height,s.s,s.c,(Math.sin(tick*s.v+s.p)+1)/2*.8+.05); });
  parts = parts.filter(p => p.al > 0);
  parts.forEach(p => { p.vy += p.g; p.x += p.vx; p.y += p.vy; p.al -= p.fw ? .012 : .025;
    if (p.fw){ ctx.globalAlpha = Math.max(p.al,0); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill(); }
    else star(p.x,p.y,p.r,p.c,Math.max(p.al,0)); });
  ctx.globalAlpha = 1;

  if (started && !finished){
    const p = Math.min(clock()/DUR, 1);
    const n = Math.floor(Math.min(p/0.85,1) * words.length);       // words finish at 85% of the song
    for (; shown < n; shown++) words[shown].classList.add('on');
    if (p >= .9) sign.classList.add('on');
    if (fallback && p >= 1) finale();
  }
}
loop();
</script>
